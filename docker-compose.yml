services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pesanmenu
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: pesanmenu
      MYSQL_PASSWORD: pesanmenu
    ports:
      - "3307:3306"
    volumes:
      - pesanmenu_mysql:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: pesanmenu
      DB_USERNAME: pesanmenu
      DB_PASSWORD: pesanmenu
      DB_TIMEZONE: "+07:00"
      PAYMENT_MODE: COD
      MIDTRANS_SERVER_KEY: ""
      MIDTRANS_PRODUCTION: "false"
      MIDTRANS_ACQUIRER: gopay
      MAIL_DRIVER: log
      MAIL_FROM: no-reply@pesanmenu.local
      SMTP_HOST: ""
      SMTP_PORT: 587
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_ENCRYPTION: tls
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html

volumes:
  pesanmenu_mysql:
